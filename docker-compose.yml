services:

  db:
    image: postgres:17-alpine
    container_name: cinebh-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cinebh}
      POSTGRES_USER: ${DB_USERNAME:-cinebh_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cinebh123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cinebh_app} -d ${DB_NAME:-cinebh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cinebh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: cinebh-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: cinebh-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/cinebh;
      echo 'Bucket cinebh ready';
      "


  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinebh-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8443:8443"
    environment:
      # === Override localhost → Docker service names ===
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/cinebh
      - SPRING_DATASOURCE_USERNAME=cinebh_app
      - SPRING_DATASOURCE_PASSWORD=cinebh123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_JPA_SHOW_SQL=false
      - SPRING_MAIL_HOST=mail.smtp2go.com
      - SPRING_MAIL_PORT=2525
      - SPRING_MAIL_USERNAME=atlantbhpraksa
      - SPRING_MAIL_PASSWORD=${SMTP2GO_PASSWORD}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
      - SERVER_SSL_KEY_STORE=/app/cinebh-keystore.p12
      - SERVER_SSL_KEY_STORE_PASSWORD=${KEYSTORE_PASSWORD}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - APP_SECURITY_JWT_SECRET=${JWT_SECRET}
      - APP_SECURITY_COOKIE_DOMAIN=${COOKIE_DOMAIN:-localhost}
      - APP_SECURITY_COOKIE_SECURE=${COOKIE_SECURE:-false}
      - APP_SECURITY_COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-Lax}
      - APP_SECURITY_CORS_ALLOWED_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
      - APP_FRONTEND_BASE_URL=${FRONTEND_URL:-http://localhost:8080}
      - APP_STORAGE_ENDPOINT=http://minio:9000
      - APP_STORAGE_PATH_STYLE_ACCESS_ENABLED=true
      - APP_STORAGE_PUBLIC_BASE_URL=${STORAGE_PUBLIC_BASE_URL:-http://localhost:9000/cinebh}
      - APP_STORAGE_PRESIGN_ENDPOINT=${STORAGE_PRESIGN_ENDPOINT:-http://localhost:9000}

  frontend:
    build:
      context: ../cinebh-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: cinebh-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"


volumes:
  pgdata:
  redisdata:
  miniodata:
