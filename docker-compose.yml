services:
  db:
    image: postgres:17-alpine
    container_name: cinebh-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cinebh}
      POSTGRES_USER: ${DB_USERNAME:-cinebh_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cinebh123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cinebh_app} -d ${DB_NAME:-cinebh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cinebh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: cinebh-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: cinebh-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY:-minioadmin} ${STORAGE_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/${STORAGE_BUCKET:-cinebh};
      echo Bucket ready;
      "

  backend:
    image: ${BACKEND_IMAGE:-cinebh-backend:latest}
    container_name: cinebh-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-cinebh}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-cinebh_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cinebh123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_MAIL_HOST: mail.smtp2go.com
      SPRING_MAIL_PORT: "2525"
      SPRING_MAIL_USERNAME: atlantbhpraksa
      SPRING_MAIL_PASSWORD: ${SMTP2GO_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SERVER_PORT: "8080"
      SERVER_SSL_ENABLED: "false"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APP_SECURITY_JWT_SECRET: ${JWT_SECRET}
      APP_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION_MS: "900000"
      APP_SECURITY_JWT_REFRESH_TOKEN_EXPIRATION_MS: "86400000"
      APP_SECURITY_JWT_REMEMBER_ME_REFRESH_TOKEN_EXPIRATION_MS: "2592000000"
      APP_SECURITY_COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      APP_SECURITY_COOKIE_SECURE: ${COOKIE_SECURE}
      APP_SECURITY_COOKIE_SAME_SITE: ${COOKIE_SAME_SITE}
      APP_SECURITY_COOKIE_HTTP_ONLY: "true"
      APP_SECURITY_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS}
      APP_SECURITY_CORS_ALLOWED_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      APP_FRONTEND_BASE_URL: ${FRONTEND_URL}
      APP_NOTIFICATION_FROM_ADDRESS: slavisa.covakusic@student.etf.unibl.org
      APP_NOTIFICATION_FROM_NAME: Cinebh
      APP_VERIFICATION_CODE_TTL_MINUTES: "15"
      APP_VERIFICATION_CODE_LENGTH: "6"
      APP_VALIDATION_CACHE_MX_RECORD_TTL_DAYS: "7"
      APP_VALIDATION_CACHE_MX_RECORD_PREFIX: "mx_record:"
      APP_STORAGE_BUCKET: ${STORAGE_BUCKET:-cinebh}
      APP_STORAGE_REGION: eu-central-1
      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      APP_STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      APP_STORAGE_PATH_STYLE_ACCESS_ENABLED: "true"
      APP_STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL}

  frontend:
    image: ${FRONTEND_IMAGE:-cinebh-frontend:latest}
    container_name: cinebh-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  pgdata:
  redisdata:
  miniodata:
